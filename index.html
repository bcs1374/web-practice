<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ireland Info Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
<div class="country-card">

  <h1 id="country-name">Ireland</h1>
  <input type="text" id="country-input" placeholder="Type a country name" />
  <button id="update-country">Update country</button>

  <ul>
    <li id="country-name"><strong>Country:</strong> Ireland</li>
    <li id="country-capital"><strong>Capital:</strong> Dublin</li>
    <li id="country-region"><strong>Region:</strong> Europe</li>
    <li id="country-population"><strong>Population:</strong> 5,056,935</li>
    <li><strong>Population change rate:</strong> +.7%/year</li>
  </ul>
</div>
  
  <script src="script.js"></script>
</body>
</html>
