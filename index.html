<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ireland Info Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
<div class="country-card">

  <h1 id="country-name">Ireland</h1>
  <input type="text" id="country-input" placeholder="Type a country name" />
  <button id="update-country">Update country</button>

  <ul>
    <li><strong>Country:</strong> <span id="country-name2"></span></li>
    <li><strong>Capital:</strong> <span id="country-capital"></span></li>
    <li><strong>Region:</strong> <span id="country-region"></span></li>
    <li><strong>Population:</strong> <span id="country-population"></span></li>
    <li><strong>Population change rate:</strong> +.7%/year</li>
  </ul>
</div>
  
  <script src="script.js"></script>
</body>
</html>
